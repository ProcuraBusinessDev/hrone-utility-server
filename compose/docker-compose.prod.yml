volumes:
  hrone-postgres-prod:

networks:
  hrone-prod-network:
    external: true

services:
  utility:
    container_name: hrone-utility-prod
    image: ghcr.io/procurabusinessdev/hrone-utility:release
    restart: unless-stopped
    networks:
      - hrone-prod-network
    ports:
      - "8081:8081"
    volumes:
      - ./envs/.env.prod:/app/.env 
  postgres:
    container_name: hrone-postgres-prod
    image: postgres:17-alpine
    restart: unless-stopped
    networks:
      - hrone-prod-network
    ports:
      - "8432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - hrone-postgres-prod:/var/lib/postgresql/data